<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f9">
  <title>Reset password · CoreFlow AI</title>
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/design-system.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="./login.html" aria-label="CoreFlow AI home"><span class="brand-mark">C</span>CoreFlow <span class="brand-ai">AI</span></a>
    <p class="eyebrow">ACCOUNT SECURITY</p>
    <h1>Choose a new password</h1>
    <p class="muted">Use at least 8 characters for your new password.</p>
    <p id="recovery-message" class="form-message" role="status" aria-live="polite">Checking your reset link…</p>
    <form id="reset-form" hidden>
      <label for="new-password">New password</label>
      <div class="password-control">
        <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <button class="password-toggle" type="button" data-password-toggle="new-password" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
      <p class="field-note password-help">At least 8 characters</p>
      <button id="reset-submit" class="button button-primary button-full" type="submit">Update password</button>
    </form>
    <p class="auth-switch"><a class="text-button" href="./login.html">Back to log in</a></p>
  </main>
  <script type="module" src="./js/pages/reset-password.js"></script>
</body>
</html>
