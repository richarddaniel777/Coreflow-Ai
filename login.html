<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f9">
  <title>Log in · CoreFlow AI</title>
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/design-system.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="./login.html" aria-label="CoreFlow AI home"><span class="brand-mark">C</span>CoreFlow <span class="brand-ai">AI</span></a>
    <p class="eyebrow">CUSTOMER MANAGEMENT, MADE SIMPLE</p>
    <h1 id="form-title">Welcome back</h1>
    <p class="muted">Keep your enquiries and follow-ups moving.</p>
    <div class="mode-switch" aria-label="Account access">
      <button type="button" data-mode="login">Log in</button><button type="button" data-mode="signup">Sign up</button>
    </div>
    <form id="auth-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <div class="label-row">
        <label for="password">Password</label>
        <span id="password-rule" class="field-note" hidden>At least 8 characters</span>
      </div>
      <div class="password-control">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
      <div id="confirm-password-row" hidden>
        <label for="confirm-password">Confirm password</label>
        <div class="password-control">
          <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password">
          <button class="password-toggle" type="button" data-password-toggle="confirm-password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
      </div>
      <div id="forgot-row" class="forgot-row"><button id="forgot-password-link" class="text-button" type="button">Forgot password?</button></div>
      <button id="auth-submit" class="button button-primary button-full" type="submit">Log in</button>
      <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
    </form>
    <p class="auth-switch"><span id="auth-switch">New to CoreFlow AI?</span> <button id="auth-switch-link" type="button" class="text-button" data-mode="signup">Sign up</button></p>
  </main>
  <script type="module" src="./js/pages/auth.js"></script>
</body>
</html>
